<!doctype html>
<!-- Adapted from Tabler's Job Listing template (MIT). See vendor/tabler/LICENSE.tabler.txt. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A daily arXiv catalog for AI research. Find new papers, save a reading list, and download the originals.">
  <title>Paper Radar · Daily AI research</title>
  <link rel="stylesheet" href="./vendor/tabler/tabler.min.css">
  <script type="module" src="./app.js?v=affiliations-1"></script>
</head>
<body>
  <a class="visually-hidden-focusable p-2" href="#papers">Skip to papers</a>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <a class="navbar-brand fw-bold" href="./">Paper Radar</a>
        <nav class="navbar-nav flex-row gap-3 ms-auto" aria-label="Project links">
          <a class="nav-link px-0" href="https://ceasonen.github.io/">Cheng Chen</a>
          <a class="nav-link px-0" href="https://github.com/ceasonen/arxiv_paper_ai">GitHub</a>
        </nav>
      </div>
    </header>

    <div class="page-wrapper">
      <main id="content" class="d-flex flex-column flex-fill">
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <h1 class="page-title">Daily AI papers</h1>
                <p class="text-secondary mt-1 mb-0">Browse new arXiv papers and build your reading list.</p>
              </div>
              <div class="col-12 col-md-auto ms-md-auto">
                <div class="text-md-end">
                  <div class="text-secondary small">Latest arXiv release</div>
                  <div class="d-flex justify-content-md-end align-items-center gap-2 flex-wrap mt-1">
                    <time id="source-date" class="fw-semibold">Loading…</time>
                    <span id="digest-count" class="badge bg-blue-lt" hidden></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="page-body">
          <div class="container-xl">
            <div class="row gx-0 gy-4 gx-md-4">
              <aside class="col-md-3" aria-label="Paper filters">
                <div class="sticky-md-top">
                  <h2 class="subheader mb-2 d-none d-md-block">Library</h2>
                  <div class="list-group list-group-transparent flex-row flex-md-column mx-0 mb-3" role="group" aria-label="Library">
                    <button class="list-group-item list-group-item-action active" type="button" data-mode="all" aria-pressed="true">Browse papers</button>
                    <button class="list-group-item list-group-item-action" type="button" data-mode="saved" aria-pressed="false">
                      Reading list <span id="saved-count" class="badge bg-secondary-lt ms-1">0</span>
                    </button>
                  </div>
                  <details id="topic-filters" open>
                    <summary class="btn btn-outline-secondary w-100 d-md-none">Filters</summary>
                    <h2 class="subheader mb-2 mt-3 mt-md-0">Topics</h2>
                    <div id="topics" class="list-group list-group-transparent mx-0" role="group" aria-label="Topics"></div>
                  </details>
                </div>
              </aside>

              <section id="papers" class="col-md-9" aria-labelledby="heading" tabindex="-1">
                <div class="row row-cards">
                  <div class="col-12">
                    <div class="row g-2 align-items-start mb-3">
                      <div class="col">
                        <h2 id="heading" class="h3 mb-1">Browse papers</h2>
                        <p id="result-count" class="text-secondary mb-0" role="status" aria-live="polite">Loading the catalog…</p>
                      </div>
                      <div class="col-auto">
                        <button id="export" type="button" class="btn btn-outline-primary btn-sm" hidden>Export PDF links</button>
                      </div>
                    </div>
                    <div class="row g-2">
                      <div class="col">
                        <label class="visually-hidden" for="search">Search papers</label>
                        <input id="search" class="form-control" type="search" placeholder="Search title, author, or keyword" autocomplete="off">
                      </div>
                      <div class="col-12 col-sm-auto">
                        <label class="visually-hidden" for="release">Announcement date</label>
                        <select id="release" class="form-select">
                          <option value="latest">Latest release</option>
                          <option value="all">All releases</option>
                        </select>
                      </div>
                    </div>
                    <div class="row g-2 mt-2">
                      <div class="col-6">
                        <label class="form-label" for="author-search">Author</label>
                        <input id="author-search" class="form-control" type="search" placeholder="Author name" list="author-options" autocomplete="off">
                        <datalist id="author-options"></datalist>
                      </div>
                      <div class="col-6">
                        <label class="form-label" for="institution-search">School or institution</label>
                        <input id="institution-search" class="form-control" type="search" placeholder="Institution name" list="institution-options" aria-describedby="affiliation-coverage" autocomplete="off">
                        <datalist id="institution-options"></datalist>
                      </div>
                    </div>
                    <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap mt-2">
                      <p id="affiliation-coverage" class="text-secondary small mb-0"></p>
                      <button id="clear-filters" class="btn btn-link btn-sm p-0" type="button" hidden>Clear filters</button>
                    </div>
                  </div>
                  <div class="col-12">
                    <div id="entries" class="space-y"></div>
                    <div class="d-flex justify-content-center mt-3">
                      <button id="more" type="button" class="btn btn-outline-primary" hidden>Load more papers</button>
                    </div>
                    <noscript><p class="alert alert-info">Enable JavaScript to browse the catalog, or <a href="https://arxiv.org/list/cs.AI/recent">browse recent papers on arXiv</a>.</p></noscript>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer footer-transparent d-print-none">
        <div class="container-xl">
          <div class="row g-2 text-center align-items-center">
            <div class="col-12 col-lg-auto mt-lg-0">
              <span>Reading lists are saved on this device.</span>
            </div>
            <div class="col-12 col-lg-auto ms-lg-auto">
              <ul class="list-inline list-inline-dots mb-0">
                <li class="list-inline-item">Metadata from <a class="link-secondary" href="https://arxiv.org/">arXiv</a></li>
                <li class="list-inline-item">Template by <a class="link-secondary" href="https://tabler.io/">Tabler</a></li>
              </ul>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <template id="paper-template">
    <article class="paper card">
      <div class="card-body">
        <div class="row">
          <div class="col">
            <h3 class="h3 mb-1" data-paper="title"></h3>
            <div class="text-secondary text-break" data-paper="authors"></div>
          </div>
        </div>
        <div class="row align-items-center g-2 mt-2">
          <div class="col">
            <div class="list-inline list-inline-dots mb-0 text-secondary" data-paper="meta">
              <time class="list-inline-item"></time>
              <span class="list-inline-item" data-paper="categories"></span>
            </div>
          </div>
          <div class="col-12 col-sm-auto">
            <div class="badge-list" data-paper="topics"></div>
          </div>
        </div>
        <div data-paper="affiliations" class="small mt-2" hidden></div>
        <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
          <div class="d-flex flex-wrap gap-2" data-paper="links"></div>
          <button type="button" class="btn btn-sm btn-ghost-secondary" data-paper="abstract-toggle" aria-expanded="false">Abstract</button>
          <button type="button" class="save btn btn-sm btn-outline-primary ms-auto" aria-pressed="false">Save</button>
        </div>
        <p class="abstract text-secondary text-break border-top pt-3 mt-3 mb-0" hidden></p>
      </div>
    </article>
  </template>
</body>
</html>
